<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040406"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </linearGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.6" stroke-opacity="0.65"/>
    </pattern>

    <radialGradient id="matrix-glow" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulse-green {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }
    @keyframes radar-pulse {
      0% { r: 4px; opacity: 0.8; }
      50% { r: 9px; opacity: 0.15; }
      100% { r: 4px; opacity: 0.8; }
    }
    .cursor-blink {
      animation: blink 1s infinite;
    }
    .status-pulse {
      animation: pulse-green 2s infinite ease-in-out;
      transform-origin: 14px 13px;
    }
    .radar-ring {
      animation: radar-pulse 2.5s infinite ease-out;
    }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'DejaVu Sans Mono', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1280" height="540" fill="url(#bg-grad)"/>
  <rect width="1280" height="540" fill="url(#matrix-glow)"/>

  <!-- Left Side: Code & Assembly Column Background -->
  <rect x="0" y="0" width="450" height="540" fill="#040407"/>

  <!-- Left Side: Rust & C Assembly Art -->
  <g class="font-mono" font-size="11.5" fill="#4b4b55">
    <text x="44" y="48" fill="#71717a" font-weight="600" letter-spacing="1">ASM DISASM // KERNEL PANIC DISPATCH</text>
    <line x1="44" y1="60" x2="410" y2="60" stroke="#27272a" stroke-width="1"/>

    <text x="44" y="94"><tspan fill="#3f3f46">0x7FFF8000: </tspan><tspan fill="#a1a1aa" font-weight="600">mov    </tspan>%rsp,%rbp</text>
    <text x="44" y="117"><tspan fill="#3f3f46">0x7FFF8007: </tspan><tspan fill="#a1a1aa" font-weight="600">lea    </tspan>rip(%rip),%rdi</text>
    <text x="44" y="140"><tspan fill="#3f3f46">0x7FFF800E: </tspan><tspan fill="#a1a1aa" font-weight="600">callq  </tspan>kernel_init</text>
    <text x="44" y="163"><tspan fill="#3f3f46">0x7FFF8013: </tspan><tspan fill="#a1a1aa" font-weight="600">test   </tspan>%eax,%eax</text>
    <text x="44" y="186"><tspan fill="#3f3f46">0x7FFF8015: </tspan><tspan fill="#a1a1aa" font-weight="600">jne    </tspan>panic_routine</text>
    
    <text x="44" y="226" fill="#71717a">/* Zero-cost panic handler */</text>
    <text x="44" y="250"><tspan fill="#e4e4e7">struct</tspan> TaskDescriptor {</text>
    <text x="44" y="272">    pid: <tspan fill="#e4e4e7">u32</tspan>,</text>
    <text x="44" y="294">    rip: <tspan fill="#e4e4e7">u64</tspan>, rsp: <tspan fill="#e4e4e7">u64</tspan>,</text>
    <text x="44" y="316">    state: AtomicState,</text>
    <text x="44" y="338">};</text>

    <text x="44" y="380"><tspan fill="#e4e4e7">impl</tspan> Drop <tspan fill="#e4e4e7">for</tspan> MemArena {</text>
    <text x="44" y="402">    <tspan fill="#e4e4e7">fn</tspan> drop(&amp;<tspan fill="#e4e4e7">mut</tspan> self) {</text>
    <text x="44" y="424">        self.guard.unprotect();</text>
    <text x="44" y="446">    }</text>
    <text x="44" y="468">}</text>

    <text x="44" y="508" fill="#3f3f46" font-size="10">ARCH: x86_64-unknown-linux-gnu</text>
  </g>

  <!-- Vertical Divider with animated radar nodes -->
  <line x1="450" y1="30" x2="450" y2="510" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="450" cy="140" r="4" fill="#a1a1aa"/>
  <circle cx="450" cy="270" r="5" fill="#ffffff"/>
  <circle cx="450" cy="270" r="9" fill="none" stroke="#ffffff" stroke-width="1" class="radar-ring"/>
  <circle cx="450" cy="400" r="4" fill="#a1a1aa"/>

  <!-- Right Side Main Identity Block (Prominent, High-Contrast) -->
  <g transform="translate(500, 36)">
    <!-- Top Meta -->
    <g class="font-mono">
      <rect x="0" y="0" width="200" height="28" rx="5" fill="#141418" stroke="#27272a" stroke-width="1"/>
      <circle cx="16" cy="14" r="7" fill="#22c55e" fill-opacity="0.25"/>
      <circle cx="16" cy="14" r="4" fill="#22c55e" class="status-pulse"/>
      <text x="30" y="18" fill="#e4e4e7" font-size="11" font-weight="600" letter-spacing="1">SESSION: ROOT // OK</text>

      <text x="730" y="18" text-anchor="end" fill="#71717a" font-size="12">github.com/Beforov1337</text>
    </g>

    <!-- Username / Big Header with animated cursor -->
    <text x="0" y="105" class="font-mono" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      IsThatBeforov?<tspan fill="#71717a" class="cursor-blink">_</tspan>
    </text>

    <!-- Subtitle Spec -->
    <g transform="translate(0, 150)">
      <text class="font-mono" fill="#f4f4f5" font-size="22" font-weight="700" letter-spacing="1.5">
        &gt; RUST / C SYSTEMS DEVELOPER
      </text>
      <text y="30" class="font-sans" fill="#a1a1aa" font-size="15">
        Specialized in high-performance engines, low-level daemons, and bare-metal architectures.
      </text>
    </g>

    <!-- Spec Metrics Table/Blocks -->
    <g transform="translate(0, 225)">
      <g transform="translate(0, 0)">
        <rect width="230" height="70" rx="10" fill="#111115" stroke="#27272a" stroke-width="1.2"/>
        <text x="18" y="26" class="font-mono" fill="#71717a" font-size="11" letter-spacing="1">PRIMARY TECH</text>
        <text x="18" y="52" class="font-mono" fill="#ffffff" font-size="16" font-weight="700">Rust • C • x86 ASM</text>
      </g>
      <g transform="translate(250, 0)">
        <rect width="230" height="70" rx="10" fill="#111115" stroke="#27272a" stroke-width="1.2"/>
        <text x="18" y="26" class="font-mono" fill="#71717a" font-size="11" letter-spacing="1">SPECIALTY</text>
        <text x="18" y="52" class="font-mono" fill="#ffffff" font-size="16" font-weight="700">Bare Metal &amp; Low-Lvl</text>
      </g>
      <g transform="translate(500, 0)">
        <rect width="230" height="70" rx="10" fill="#111115" stroke="#27272a" stroke-width="1.2"/>
        <text x="18" y="26" class="font-mono" fill="#71717a" font-size="11" letter-spacing="1">CONTRACTS</text>
        <text x="18" y="52" class="font-mono" fill="#22c55e" font-size="16" font-weight="700">Available to Hire</text>
      </g>
    </g>

    <!-- CTA & Telegram Order Box -->
    <g transform="translate(0, 335)">
      <rect width="730" height="82" rx="14" fill="#141419" stroke="#3f3f46" stroke-width="1.5"/>
      <rect x="2" y="2" width="726" height="78" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      
      <!-- Telegram SVG Icon -->
      <g transform="translate(28, 23) scale(1.5)">
        <path d="M20.665 3.717l-17.73 6.837c-1.21.486-1.203 1.161-.222 1.462l4.552 1.42 10.532-6.645c.498-.303.953-.14.579.192l-8.533 7.701h-.002l-.313 4.674c.459 0 .661-.21.917-.46l2.203-2.14 4.58 3.385c.844.464 1.452.226 1.662-.785l3.003-14.15c.308-1.233-.472-1.793-1.282-1.426z" fill="#ffffff"/>
      </g>

      <text x="88" y="34" class="font-sans" fill="#a1a1aa" font-size="13" font-weight="500">
        Commission a Project / Telegram Contact:
      </text>
      <text x="88" y="60" class="font-mono" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="0.5">
        @kernelpanic_us
      </text>

      <g transform="translate(560, 20)">
        <rect width="145" height="42" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
        <text x="72" y="26" text-anchor="middle" class="font-mono" fill="#ffffff" font-size="13" font-weight="700">CONTACT ↗</text>
      </g>
    </g>
  </g>

  <!-- Scanlines overlay -->
  <rect width="1280" height="540" fill="url(#scanlines)" pointer-events="none"/>
</svg>
